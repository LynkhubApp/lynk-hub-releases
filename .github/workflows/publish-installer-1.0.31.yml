name: Send Installer 1.0.31 notes to the private bot chat
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  notify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'publish-installer-1.0.31'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Deliver the private Telegram message
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP"
          trap 'rm -f bot-key.pem bot-public.pem bot-envelope.bin' EXIT
          branch=publish-installer-1.0.31
          prefix=.release-staging/telegram-1.0.31
          if gh api "repos/$GH_REPO/contents/$prefix.pub?ref=$branch" --silent 2>/dev/null; then
            echo "Private notification handoff already started"
            exit 0
          fi
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out bot-key.pem 2>/dev/null
          openssl pkey -in bot-key.pem -pubout -out bot-public.pem
          gh api -X PUT "repos/$GH_REPO/contents/$prefix.pub" -f branch="$branch" -f message='Publish ephemeral key for the private Telegram delivery' -f content="$(base64 -w0 bot-public.pem)" --jq '.commit.sha'
          for attempt in {1..60}; do
            if content=$(gh api "repos/$GH_REPO/contents/$prefix.enc?ref=$branch" --jq '.content' 2>/dev/null) && printf '%s' "$content" | base64 -d > bot-envelope.bin && test -s bot-envelope.bin; then
              break
            fi
            sleep 10
          done
          test -s bot-envelope.bin
          openssl pkeyutl -decrypt -inkey bot-key.pem -in bot-envelope.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | python3 -c '
          import json, re, sys, urllib.error, urllib.parse, urllib.request
          token, chat_id = json.load(sys.stdin)
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not re.fullmatch(r"[1-9][0-9]*", chat_id):
              raise SystemExit("Invalid private Telegram configuration")
          text = """Lynk Hub Installer 1.0.31

          • Меню «Ключ ADB»: импорт сохранённого ключа, создание нового и возврат к предыдущему.
          • После смены ключа можно повторить последнюю операцию.
          • Журнал показывает отправку публичного ключа и этап сбоя подключения к машине.

          Скачать: https://github.com/LynkhubApp/lynk-hub-releases/releases/latest/download/LynkHubInstaller.apk"""
          text = "\n".join(line.lstrip() for line in text.splitlines())
          data = urllib.parse.urlencode({"chat_id":chat_id,"text":text,"disable_web_page_preview":"true"}).encode()
          try:
              with urllib.request.urlopen("https://api.telegram.org/bot" + token + "/sendMessage", data=data, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Telegram rejected the request: HTTP " + str(error.code)) from None
          except Exception:
              raise SystemExit("Telegram delivery could not be confirmed") from None
          if result.get("ok") is not True or result.get("result", {}).get("chat", {}).get("type") != "private":
              raise SystemExit("Private Telegram delivery could not be confirmed")
          print("Telegram private delivery confirmed")
          '
